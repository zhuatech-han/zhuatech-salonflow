spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://mysql:3306/zhuatech_salonflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLocalInfile=false&sslMode=trust}
    username: ${DATABASE_USER:salonflow}
    password: ${DATABASE_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
salonflow:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD}
  seed-demo: ${SEED_DEMO:false}

  smtp-host: ${SMTP_HOST:}
  smtp-port: ${SMTP_PORT:587}
  smtp-user: ${SMTP_USERNAME:}
  smtp-password: ${SMTP_PASSWORD:}
  smtp-from: ${SMTP_FROM:}
  smtp-starttls: ${SMTP_STARTTLS:true}
  smtp-ssl: ${SMTP_SSL:false}
  reminders-enabled: ${REMINDERS_ENABLED:true}
